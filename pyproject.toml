[tool.poetry]
name = "cosmic"
version = "1.0.0"
description = "A cosmicpython-style aggregate framework: message bus, unit of work, aggregate repositories, and a JSON:API compound-document serializer."
authors = ["Ben Davis <ben@bencdavis.com>"]
packages = [
    { include = "cosmic" }
]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = "^2.0.30"
pydantic = "^2.0.2"
# Only `cosmic.contrib.fastapi` imports FastAPI, and only for *read adapters* —
# there is still no routing generation here. Everything else in the library must
# stay importable without it, so a handler remains callable from a worker or a
# CLI. Keep it optional.
fastapi = { version = ">=0.110", optional = true }

[tool.poetry.extras]
fastapi = ["fastapi"]

[tool.poetry.dev-dependencies]
pytest = "^8.2.1"
pytest-clarity = "^1.0.1"
pytest-watcher = "^0.2.1"
debugpy = "^1.6.2"

[tool.poetry.group.dev.dependencies]
dirty-equals = "^0.5.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
